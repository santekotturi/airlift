[project]
name = "hrvlab"
version = "0.1.0"
description = "Reverse-engineer Apple's nightly Recovery HRV and Fitbit's daily HRV from an Apple Health export."
requires-python = ">=3.11"
dependencies = ["lxml>=5", "pandas>=2.2", "pyarrow>=16", "numpy>=1.26"]

[project.scripts]
hrvlab = "hrvlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
